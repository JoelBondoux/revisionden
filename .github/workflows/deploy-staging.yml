name: Deploy staging

# Every push to staging deploys https://staging.revisionden.com.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  # The public website (apps/www) on https://www-staging.revisionden.com (decision 0005).
  www:
    uses: ./.github/workflows/deploy-www.yml
    with:
      environment: staging
    secrets: inherit
