name: End-to-end and accessibility

# Playwright at phone, tablet and desktop sizes with axe checks (G4), on pull requests into
# staging and main. Runs against the built web app served locally, so it needs no secrets.
on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright + axe (phone, tablet, desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @revisionden/e2e exec playwright install --with-deps chromium
      - name: Build the web app
        env:
          VITE_ENVIRONMENT: staging
        run: pnpm --filter @revisionden/web build
      - name: Run the end-to-end suite
        run: pnpm --filter @revisionden/e2e e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
