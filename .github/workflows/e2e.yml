name: End-to-end and accessibility

# Playwright at phone, tablet and desktop sizes with axe checks (G4), on pull requests into dev,
# staging and main (G10). Runs against the built web app served locally, so it needs no secrets.
# The web app is built once (job "build", artifact "web-dist") and every shard downloads it; other
# checks that need the built app (such as the contrast sweep) can add a job here with
# `needs: build` and download the same artifact instead of building again.
# "End-to-end result" is the one check to require in branch protection: it is green only when
# every shard passed.
on:
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the web app once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        env:
          VITE_ENVIRONMENT: staging
        run: pnpm --filter @revisionden/web build
      - name: Share the build with the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: Playwright + axe (shard ${{ matrix.shard }} of 4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ubuntu-26.04 runner images list packages.microsoft.com, whose apt release file is no longer
      # signed, so apt-get update inside --with-deps can fail on it (G12). Nothing here needs it.
      - name: Drop the unsigned Microsoft apt source
        run: grep -rl packages.microsoft.com /etc/apt/sources.list.d | xargs -r sudo rm -f
      - name: Install Chromium for Playwright
        run: pnpm --filter @revisionden/e2e exec playwright install --with-deps chromium
      - name: Use the shared build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Run this shard of the end-to-end suite (all projects)
        # The contrast sweep runs once in its own job below, not in every shard (W21).
        run: pnpm --filter @revisionden/e2e e2e --shard=${{ matrix.shard }}/4 --grep-invert @contrast
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 7

  contrast:
    # W21 (decision 0012): every screen and the main dialogs in all 10 looks, light and dark,
    # from computed styles. It fails on a contrast failure not in e2e/tests/contrast-known.json,
    # on a listed one that is now fixed, and on a route in routes.tsx with no row in the sweep.
    name: Contrast sweep (tier 1)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ubuntu-26.04 runner images list packages.microsoft.com, whose apt release file is no longer
      # signed, so apt-get update inside --with-deps can fail on it (G12). Nothing here needs it.
      - name: Drop the unsigned Microsoft apt source
        run: grep -rl packages.microsoft.com /etc/apt/sources.list.d | xargs -r sudo rm -f
      - name: Install Chromium for Playwright
        run: pnpm --filter @revisionden/e2e exec playwright install --with-deps chromium
      - name: Use the shared build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Run the tier 1 contrast sweep (phone, every look; desktop, default look)
        run: >-
          pnpm --filter @revisionden/e2e exec playwright test tests/contrast-sweep.spec.ts
          --project=phone --project=desktop --grep @contrast --grep-invert @contrast-painted --trace off
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: e2e/playwright-report
          retention-days: 7

  e2e-result:
    name: End-to-end result
    needs: [build, e2e, contrast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard and the contrast sweep passed
        run: |
          echo "build: ${{ needs.build.result }}, e2e: ${{ needs.e2e.result }}, contrast: ${{ needs.contrast.result }}"
          [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "success" ] && [ "${{ needs.contrast.result }}" = "success" ]
