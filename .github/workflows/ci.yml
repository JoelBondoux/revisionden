name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Lint, typecheck, unit tests (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:scripts
      - run: pnpm test:coverage
      - name: Check VERSION format
        run: pnpm version:show

  python:
    name: Maths engine tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/maths
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/maths/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  content:
    name: Content validation (schemas, links, maths answers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/maths/requirements.txt
      - run: pip install -r services/maths/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Validator tests
        run: node --test 'scripts/content/*.test.mjs'
      - name: Validate content
        run: pnpm content:validate

  maths-container:
    name: Maths engine container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: services/maths/smoke-test.sh
