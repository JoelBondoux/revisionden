name: Learn it first links

# Requests every link in content/learn-links/ and fails on anything other than 2xx or 3xx, or on a
# match-checked page whose title has changed (scripts/content/check-links.mjs). Runs when the links
# change, and weekly to catch pages that have been moved, removed or rewritten. It also reports what
# each provider's home page answers from the runner, and the link coverage (neither can fail).
on:
  pull_request:
    branches: [dev, staging, main]
    paths:
      - 'content/learn-links/**'
      - 'scripts/content/check-links.mjs'
      - 'scripts/content/learn-links.mjs'
      - 'content/schemas/learn-links.schema.json'
      - '.github/workflows/learn-links.yml'
  push:
    branches: [dev]
    paths:
      - 'content/learn-links/**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: Check Learn it first links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: What each provider answers from this runner
        run: node scripts/content/check-links.mjs --probe-providers
      - name: Link coverage
        run: node scripts/content/check-links.mjs --coverage
      - run: node scripts/content/check-links.mjs
