# Cloudflare Worker for the RevisionDen API.
# Upload buckets are in the EU jurisdiction (data stays in the EU) with a 24-hour delete rule.
# No real IDs or secrets here: secrets (including AI_GATEWAY_URL, which holds the account id)
# are set with `wrangler secret put <NAME> --env <env>`
# and listed in docs/ENVIRONMENTS.md. Locally, put them in apps/api/.dev.vars (git-ignored).
name = "revisionden-api-dev"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Local development (`pnpm --filter @revisionden/api dev`) uses these top-level values.
[vars]
ENVIRONMENT = "development"
API_ORIGIN = "http://localhost:8787"
WEB_ORIGIN = "http://localhost:5173"
PASSKEY_RP_ID = "localhost"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "revisionden-uploads-dev"
jurisdiction = "eu"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# AppDeck operator bridge (/v1/operator), per address.
[[ratelimits]]
name = "OPERATOR_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

# No cron locally. Neon suspends an idle database after 5 minutes and every tick wakes it; use
# `wrangler dev --test-scheduled` to run the scheduled handler by hand.
# `crons = []` (not leaving [triggers] out) is what removes a cron from an already deployed Worker.
[triggers]
crons = []

# ---------------------------------------------------------------------------------------------
[env.dev]
name = "revisionden-api-dev"
routes = [{ pattern = "api-dev.revisionden.com", custom_domain = true }]

[env.dev.vars]
ENVIRONMENT = "development"
API_ORIGIN = "https://api-dev.revisionden.com"
WEB_ORIGIN = "https://dev.revisionden.com"
PASSKEY_RP_ID = "dev.revisionden.com"
# Dev only: also serve the pilot drafts so the family can try them. The API ignores this outside
# development, and the config test checks staging and production never set it.
SERVE_DRAFT_CONTENT = "true"
# Dev only (J12c): testers may try every effect style in Settings; nothing is unlocked for real.
# The API ignores this outside development, and the config test checks staging and production.
STYLE_TESTER = "true"

# No cron in dev: it would wake the database every few minutes for nobody. The explicit empty
# list removes the cron already deployed; leaving [triggers] out would keep it.
[env.dev.triggers]
crons = []

[[env.dev.r2_buckets]]
binding = "UPLOADS"
bucket_name = "revisionden-uploads-dev"
jurisdiction = "eu"

[[env.dev.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[env.dev.ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# AppDeck operator bridge (/v1/operator), per address.
[[env.dev.ratelimits]]
name = "OPERATOR_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

# ---------------------------------------------------------------------------------------------
[env.staging]
name = "revisionden-api-staging"
routes = [{ pattern = "api-staging.revisionden.com", custom_domain = true }]

[env.staging.vars]
ENVIRONMENT = "staging"
API_ORIGIN = "https://api-staging.revisionden.com"
WEB_ORIGIN = "https://staging.revisionden.com"
PASSKEY_RP_ID = "staging.revisionden.com"

# No cron in staging, for the same reason as dev.
[env.staging.triggers]
crons = []

[[env.staging.r2_buckets]]
binding = "UPLOADS"
bucket_name = "revisionden-uploads-staging"
jurisdiction = "eu"

[[env.staging.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

[[env.staging.ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "2002"
simple = { limit = 20, period = 60 }

# AppDeck operator bridge (/v1/operator), per address.
[[env.staging.ratelimits]]
name = "OPERATOR_RATE_LIMITER"
namespace_id = "2003"
simple = { limit = 120, period = 60 }

# ---------------------------------------------------------------------------------------------
[env.production]
name = "revisionden-api"
routes = [{ pattern = "api.revisionden.com", custom_domain = true }]

[env.production.vars]
ENVIRONMENT = "production"
API_ORIGIN = "https://api.revisionden.com"
WEB_ORIGIN = "https://app.revisionden.com"
# The registrable domain: valid for app.revisionden.com and keeps passkeys working across subdomains.
PASSKEY_RP_ID = "revisionden.com"

# Keep in step with src/crons.ts (a test checks it). All times are UTC.
# 03:17 daily: delete data past its retention period.
# 06:30, then every 30 minutes from 07:00 to 20:30: reminders (UK waking hours in GMT and BST).
[env.production.triggers]
crons = ["17 3 * * *", "30 6 * * *", "*/30 7-20 * * *"]

[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "revisionden-uploads-production"
jurisdiction = "eu"

[[env.production.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "3001"
simple = { limit = 30, period = 60 }

[[env.production.ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "3002"
simple = { limit = 20, period = 60 }

# AppDeck operator bridge (/v1/operator), per address.
[[env.production.ratelimits]]
name = "OPERATOR_RATE_LIMITER"
namespace_id = "3003"
simple = { limit = 120, period = 60 }
